name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run quality
      # AD-10: build and fail if MSW reached dist/ (build chains check:build).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Story 1.2: shell layout, focus and scroll checks in a real browser (desktop + mobile).
      - run: npm run test:e2e
